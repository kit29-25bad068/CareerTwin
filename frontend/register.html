<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - CareerTwin AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 30%, rgba(6, 182, 212, 0.12) 0%, transparent 60%);
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card card-glow-cyan">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 48px; height: 48px; background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary)); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.4rem; margin: 0 auto 1rem;">CT</div>
        <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Create Your Career Twin</h1>
        <p style="font-size: 0.9rem;">Start your privacy-first career intelligence journey.</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Alex Chen" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="alex@university.edu" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password (min 6 characters)</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" minlength="6" required autocomplete="new-password">
        </div>

        <div style="background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 0.85rem; margin-bottom: 1.25rem;">
          <div style="font-size: 0.85rem; font-weight: 600; color: var(--accent-secondary); margin-bottom: 0.25rem;">🛡️ Privacy Commitment</div>
          <div style="font-size: 0.78rem; color: var(--text-muted);">
            Privacy Mode is active by default. Raw interview recordings are never saved permanently unless you explicitly choose Replay Mode.
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-cyan btn-lg" style="width: 100%;">
          Initialize Career Twin 🚀
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        Already have an account? <a href="/login.html" style="font-weight: 600;">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.getElementById('submit-btn');

      try {
        submitBtn.disabled = true;
        submitBtn.textContent = 'Initializing your Twin...';

        const data = await API.post('/auth/register', { name, email, password });
        if (data.success && data.token) {
          API.setToken(data.token);
          API.setUser(data.user);
          Utils.showToast('Account created successfully! Welcome to CareerTwin AI.', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        }
      } catch (err) {
        Utils.showToast(err.message || 'Registration failed.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Initialize Career Twin 🚀';
      }
    });
  </script>
</body>
</html>
