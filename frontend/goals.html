<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Goals - CareerTwin AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <div class="page-container">
        <!-- Header -->
        <div class="card card-glow" style="margin-bottom: 2rem;">
          <div class="badge badge-amber" style="margin-bottom:0.4rem;">Goal Engine & Alignment</div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.25rem;">Career Goals</h1>
          <p style="font-size: 0.95rem; color: var(--text-secondary);">
            Define your dream role and target companies. Changing your goal updates skill gaps, roadmap, and recommendations across CareerTwin.
          </p>
        </div>

        <!-- Create Goal Form -->
        <div class="card" style="margin-bottom: 2rem;">
          <div class="card-header">
            <div class="card-title">🎯 Define New Career Goal</div>
          </div>

          <form id="create-goal-form">
            <div class="grid grid-cols-2">
              <div class="form-group">
                <label class="form-label" for="goal-title">Goal Title</label>
                <input type="text" id="goal-title" class="form-input" placeholder="e.g. Become a Backend Engineer at Google" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="goal-role">Target Role</label>
                <input type="text" id="goal-role" class="form-input" placeholder="e.g. Backend Software Engineer" required>
              </div>
            </div>

            <div class="grid grid-cols-3">
              <div class="form-group">
                <label class="form-label" for="goal-company">Target Company (Optional)</label>
                <input type="text" id="goal-company" class="form-input" placeholder="e.g. Google, Stripe, Amazon">
              </div>

              <div class="form-group">
                <label class="form-label" for="goal-priority">Priority</label>
                <select id="goal-priority" class="form-select">
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                  <option value="Low">Low</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="goal-deadline">Target Deadline</label>
                <input type="date" id="goal-deadline" class="form-input">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="goal-desc">Strategy / Notes</label>
              <textarea id="goal-desc" class="form-textarea" style="min-height:75px;" placeholder="Specific focus areas, timeline, and motivations..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-md" style="width: 100%;">
              Establish Career Goal & Sync Twin 🎯
            </button>
          </form>
        </div>

        <!-- Goals List -->
        <h2 style="margin-bottom: 1.25rem;">Active & Historical Career Goals</h2>
        <div id="goals-list-container" style="display:flex; flex-direction:column; gap:1rem;">
          <p style="color:var(--text-muted); font-size:0.9rem;">Loading goals...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Navbar.init('Career Goals');
      await loadGoals();

      document.getElementById('create-goal-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('goal-title').value.trim();
        const targetRole = document.getElementById('goal-role').value.trim();
        const targetCompany = document.getElementById('goal-company').value.trim();
        const priority = document.getElementById('goal-priority').value;
        const deadline = document.getElementById('goal-deadline').value;
        const description = document.getElementById('goal-desc').value.trim();

        Utils.showLoading('Setting career goal and synchronizing Twin target requirements...');
        try {
          const res = await API.post('/goals', {
            title,
            targetRole,
            targetCompany,
            priority,
            deadline,
            description,
          });
          Utils.hideLoading();
          if (res.success) {
            Utils.showToast('Career goal established and Twin synchronized!', 'success');
            document.getElementById('create-goal-form').reset();
            await loadGoals();
          }
        } catch (err) {
          Utils.hideLoading();
          Utils.showToast(err.message || 'Failed to create goal.', 'error');
        }
      });
    });

    async function loadGoals() {
      try {
        const res = await API.get('/goals');
        if (res.success) {
          renderGoals(res.goals || []);
        }
      } catch (err) {
        console.error('Error loading goals:', err);
      }
    }

    function renderGoals(goals) {
      const container = document.getElementById('goals-list-container');
      if (!goals || goals.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding:3rem 2rem; color:var(--text-muted);">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🎯</div>
            <h3>No Goals Defined Yet</h3>
            <p style="font-size:0.85rem; margin-top:0.25rem;">Establish your primary career target above to drive intelligent recommendations.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = goals.map((g) => `
        <div class="card card-interactive">
          <div class="card-header">
            <div>
              <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem;">
                <span class="badge ${g.priority === 'High' ? 'badge-danger' : 'badge-warning'}">${Utils.escapeHTML(g.priority)} Priority</span>
                <span class="badge ${g.status === 'Active' ? 'badge-success' : 'badge-primary'}">${Utils.escapeHTML(g.status)}</span>
              </div>
              <h3 style="font-size:1.2rem; color:var(--text-primary);">${Utils.escapeHTML(g.title)}</h3>
              <p style="font-size:0.85rem; color:var(--accent-secondary); margin-top:0.2rem;">
                Role: <strong>${Utils.escapeHTML(g.targetRole)}</strong> ${g.targetCompany ? `&bull; Company: <strong>${Utils.escapeHTML(g.targetCompany)}</strong>` : ''}
              </p>
            </div>
            <div style="display:flex; gap:0.5rem;">
              <button class="btn btn-danger btn-sm" onclick="deleteGoal('${g._id}')">🗑️</button>
            </div>
          </div>
          ${g.description ? `<p style="font-size:0.88rem; color:var(--text-secondary); margin-bottom:0.75rem;">${Utils.escapeHTML(g.description)}</p>` : ''}
          <div style="font-size:0.78rem; color:var(--text-muted); display:flex; justify-content:space-between;">
            <span>Deadline: ${g.deadline ? Utils.formatDate(g.deadline) : 'Ongoing'}</span>
            <span>Created: ${Utils.formatDate(g.createdAt)}</span>
          </div>
        </div>
      `).join('');
    }

    async function deleteGoal(id) {
      if (!confirm('Are you sure you want to delete this career goal?')) return;
      try {
        const res = await API.delete(`/goals/${id}`);
        if (res.success) {
          Utils.showToast('Goal removed.', 'info');
          await loadGoals();
        }
      } catch (err) {
        Utils.showToast(err.message || 'Error deleting goal.', 'error');
      }
    }
  </script>
</body>
</html>
