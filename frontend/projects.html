<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Evaluator - CareerTwin AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <div class="page-container">
        <!-- Header -->
        <div class="card card-glow" style="margin-bottom: 2rem;">
          <div class="badge badge-purple" style="margin-bottom:0.4rem;">Engineering Rubric Evaluator</div>
          <h1 style="font-size: 1.85rem; margin-bottom: 0.25rem;">AI Project Evaluator</h1>
          <p style="font-size: 0.95rem; color: var(--text-secondary);">
            Submit your showcase projects for a comprehensive 10-dimension evaluation and hackathon readiness assessment.
          </p>
        </div>

        <!-- Project Submission Form -->
        <div class="card" style="margin-bottom: 2rem;">
          <div class="card-header">
            <div class="card-title">🚀 Submit Project for AI Evaluation</div>
          </div>

          <form id="project-eval-form">
            <div class="grid grid-cols-2">
              <div class="form-group">
                <label class="form-label" for="proj-title">Project Title</label>
                <input type="text" id="proj-title" class="form-input" placeholder="e.g. Distributed Task Queue" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="proj-tagline">Tagline / One-Liner</label>
                <input type="text" id="proj-tagline" class="form-input" placeholder="e.g. High-throughput job processing with Redis and WebSockets">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="proj-description">Technical Description & Architecture</label>
              <textarea id="proj-description" class="form-textarea" style="min-height: 110px;" placeholder="Explain the problem solved, architectural components, database schema choices, and technical trade-offs..." required></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="proj-techstack">Tech Stack (comma separated)</label>
              <input type="text" id="proj-techstack" class="form-input" placeholder="e.g. Node.js, Express, MongoDB, Redis, Docker, TailwindCSS">
            </div>

            <div class="grid grid-cols-3">
              <div class="form-group">
                <label class="form-label" for="proj-github">GitHub Repository URL</label>
                <input type="url" id="proj-github" class="form-input" placeholder="https://github.com/...">
              </div>

              <div class="form-group">
                <label class="form-label" for="proj-demo">Live Demo URL</label>
                <input type="url" id="proj-demo" class="form-input" placeholder="https://my-app.vercel.app">
              </div>

              <div class="form-group">
                <label class="form-label" for="proj-figma">Figma / Docs URL</label>
                <input type="url" id="proj-figma" class="form-input" placeholder="https://figma.com/file/...">
              </div>
            </div>

            <button type="submit" id="submit-proj-btn" class="btn btn-primary btn-lg" style="width: 100%;">
              ⚡ Evaluate Project with AI
            </button>
          </form>
        </div>

        <!-- Evaluated Projects List -->
        <h2 style="margin-bottom: 1.25rem;">Evaluated Showcase Projects</h2>
        <div id="projects-list-container" style="display:flex; flex-direction:column; gap:1.5rem;">
          <p style="color:var(--text-muted); font-size:0.9rem;">Loading projects...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Navbar.init('Project Evaluator');
      await loadProjects();

      document.getElementById('project-eval-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const title = document.getElementById('proj-title').value.trim();
        const tagline = document.getElementById('proj-tagline').value.trim();
        const description = document.getElementById('proj-description').value.trim();
        const techStack = document.getElementById('proj-techstack').value.split(',').map((s) => s.trim()).filter(Boolean);
        const githubUrl = document.getElementById('proj-github').value.trim();
        const liveDemoUrl = document.getElementById('proj-demo').value.trim();
        const figmaUrl = document.getElementById('proj-figma').value.trim();

        Utils.showLoading('Evaluating architecture, complexity, and scalability across 10 dimensions...');
        try {
          const res = await API.post('/projects', {
            title,
            tagline,
            description,
            techStack,
            githubUrl,
            liveDemoUrl,
            figmaUrl,
          });
          Utils.hideLoading();
          if (res.success && res.project) {
            Utils.showToast('Project evaluated successfully and skills synced!', 'success');
            document.getElementById('project-eval-form').reset();
            await loadProjects();
          }
        } catch (err) {
          Utils.hideLoading();
          Utils.showToast(err.message || 'Failed to evaluate project.', 'error');
        }
      });
    });

    async function loadProjects() {
      try {
        const res = await API.get('/projects');
        if (res.success) {
          renderProjects(res.projects || []);
        }
      } catch (err) {
        console.error('Error loading projects:', err);
      }
    }

    function renderProjects(projects) {
      const container = document.getElementById('projects-list-container');
      if (!projects || projects.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align:center; padding:3rem 2rem; color:var(--text-muted);">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🚀</div>
            <h3>No projects evaluated yet</h3>
            <p style="font-size:0.85rem; margin-top:0.25rem;">Submit your first showcase project above to assess engineering depth.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = projects.map((p) => {
        const ev = p.evaluation || {};
        return `
          <div class="card card-interactive">
            <div class="card-header">
              <div>
                <h3 style="font-size:1.25rem; color:var(--text-primary); margin-bottom:0.2rem;">${Utils.escapeHTML(p.title)}</h3>
                <p style="font-size:0.85rem; color:var(--text-secondary);">${Utils.escapeHTML(p.tagline || '')}</p>
              </div>
              <div style="text-align:right;">
                <span style="font-size:1.75rem; font-weight:800; color:var(--accent-primary);">${ev.overallScore || 0}</span>
                <span style="font-size:0.8rem; color:var(--text-muted);">/100</span>
              </div>
            </div>

            <!-- Tech Stack & Links -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.75rem; margin-bottom:1rem;">
              <div style="display:flex; flex-wrap:wrap; gap:0.4rem;">
                ${(p.techStack || []).map((t) => `<span class="badge badge-primary">${Utils.escapeHTML(t)}</span>`).join('')}
              </div>
              <div style="display:flex; gap:0.5rem;">
                ${p.githubUrl ? `<a href="${p.githubUrl}" target="_blank" class="btn btn-outline btn-sm">GitHub ↗</a>` : ''}
                ${p.liveDemoUrl ? `<a href="${p.liveDemoUrl}" target="_blank" class="btn btn-cyan btn-sm">Live Demo ↗</a>` : ''}
                <button class="btn btn-danger btn-sm" onclick="deleteProject('${p._id}')">🗑️</button>
              </div>
            </div>

            <!-- Description -->
            <p style="font-size:0.88rem; color:var(--text-secondary); margin-bottom:1.25rem; line-height:1.6;">
              ${Utils.escapeHTML(p.description)}
            </p>

            <!-- 10-Dimension Score Breakdown Pills -->
            <div style="background:rgba(255,255,255,0.02); border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1rem; margin-bottom:1rem;">
              <div style="font-size:0.8rem; font-weight:700; color:var(--accent-secondary); text-transform:uppercase; margin-bottom:0.6rem;">
                10-Dimension Rubric Scores
              </div>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px, 1fr)); gap:0.5rem; font-size:0.78rem;">
                <div>Complexity: <strong>${ev.technicalComplexityScore || 0}%</strong></div>
                <div>Innovation: <strong>${ev.innovationScore || 0}%</strong></div>
                <div>Quality: <strong>${ev.engineeringQualityScore || 0}%</strong></div>
                <div>Scalability: <strong>${ev.scalabilityScore || 0}%</strong></div>
                <div>User Value: <strong>${ev.userValueScore || 0}%</strong></div>
                <div>Market: <strong>${ev.marketPotentialScore || 0}%</strong></div>
                <div>Docs: <strong>${ev.documentationScore || 0}%</strong></div>
                <div>Hackathon: <strong>${ev.hackathonReadinessScore || 0}%</strong></div>
              </div>
            </div>

            <!-- Feedback Summary -->
            <div style="font-size:0.85rem; color:var(--text-secondary);">
              <div style="color:#34d399; margin-bottom:0.25rem;"><strong>Strengths:</strong> ${(ev.strengths || []).join('; ')}</div>
              <div style="color:#fb7185; margin-bottom:0.25rem;"><strong>Areas to Improve:</strong> ${(ev.weaknesses || []).join('; ')}</div>
              <div style="color:#fbbf24;"><strong>Recommended Next Steps:</strong> ${(ev.recommendedNextSteps || []).join('; ')}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function deleteProject(id) {
      if (!confirm('Are you sure you want to delete this evaluated project?')) return;
      try {
        const res = await API.delete(`/projects/${id}`);
        if (res.success) {
          Utils.showToast('Project removed.', 'success');
          await loadProjects();
        }
      } catch (err) {
        Utils.showToast(err.message || 'Error deleting project.', 'error');
      }
    }
  </script>
</body>
</html>
