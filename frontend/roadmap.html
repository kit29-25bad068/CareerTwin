<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Roadmap - CareerTwin AI</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>

    <div class="main-content">
      <div id="topbar-container"></div>

      <div class="page-container">
        <!-- Header -->
        <div class="card card-glow" style="margin-bottom: 2rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
            <div>
              <div class="badge badge-primary" style="margin-bottom:0.4rem;">Dynamic Learning Path</div>
              <h1 style="font-size: 1.85rem; margin-bottom: 0.25rem;">Personal Career Roadmap</h1>
              <p id="roadmap-meta-desc" style="font-size: 0.95rem; color: var(--text-secondary);">
                Milestones tailored to your career goal, verified skills, and identified gaps.
              </p>
            </div>
            <button class="btn btn-cyan btn-md" onclick="generateRoadmap()">
              ⚡ Regenerate AI Roadmap
            </button>
          </div>
        </div>

        <!-- Overall Progress Card -->
        <div class="card" style="margin-bottom: 2.5rem;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem;">
            <div style="font-weight:600; font-size:1rem; color:var(--text-primary);">Roadmap Execution Progress</div>
            <div id="roadmap-pct-text" style="font-size:1.25rem; font-weight:800; color:var(--accent-cyan);">0%</div>
          </div>
          <div class="progress-track" style="height:10px;">
            <div id="roadmap-progress-bar" class="progress-bar progress-bar-cyan" style="width: 0%;"></div>
          </div>
        </div>

        <!-- Phased Milestones Timeline -->
        <div id="roadmap-milestones-container" class="roadmap-timeline">
          <p style="color:var(--text-muted); font-size:0.9rem;">Loading roadmap milestones...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Navbar.init('Career Roadmap');
      await loadRoadmap();
    });

    async function loadRoadmap() {
      try {
        const res = await API.get('/roadmap');
        if (res.success && res.hasRoadmap && res.roadmap) {
          renderRoadmap(res.roadmap);
        } else {
          renderEmptyRoadmap();
        }
      } catch (err) {
        console.error('Error loading roadmap:', err);
      }
    }

    function renderEmptyRoadmap() {
      document.getElementById('roadmap-milestones-container').innerHTML = `
        <div class="card" style="text-align:center; padding:3.5rem 2rem; color:var(--text-muted);">
          <div style="font-size:3rem; margin-bottom:0.75rem;">🗺️</div>
          <h3>No Roadmap Generated Yet</h3>
          <p style="font-size:0.9rem; margin-top:0.35rem; max-width:500px; margin-left:auto; margin-right:auto;">
            Click below to generate an AI-powered month-by-month roadmap grounded in your target role and skill gaps.
          </p>
          <button class="btn btn-cyan btn-lg" onclick="generateRoadmap()" style="margin-top:1.25rem;">
            ⚡ Generate My AI Roadmap
          </button>
        </div>
      `;
    }

    function renderRoadmap(roadmap) {
      const pct = roadmap.progressPercentage || 0;
      document.getElementById('roadmap-pct-text').textContent = `${pct}%`;
      document.getElementById('roadmap-progress-bar').style.width = `${pct}%`;
      document.getElementById('roadmap-meta-desc').textContent = `Tailored for "${roadmap.targetRole}" across ${roadmap.durationMonths || 6} months.`;

      const container = document.getElementById('roadmap-milestones-container');
      const milestones = roadmap.milestones || [];

      if (milestones.length === 0) {
        renderEmptyRoadmap();
        return;
      }

      container.innerHTML = milestones.map((m, mIdx) => `
        <div class="milestone-card card">
          <div class="milestone-node"></div>
          <div class="card-header">
            <div>
              <div class="badge badge-primary" style="margin-bottom:0.25rem;">Month ${m.monthIndex}</div>
              <h3 style="font-size:1.2rem; color:var(--text-primary);">${Utils.escapeHTML(m.monthTitle)}</h3>
              <p style="font-size:0.85rem; color:var(--accent-secondary); margin-top:0.2rem;">Focus: ${Utils.escapeHTML(m.focusArea)}</p>
            </div>
            <div style="font-size:0.8rem; color:var(--text-muted); text-align:right;">
              Goal: ${Utils.escapeHTML(m.learningGoal)}
            </div>
          </div>

          <div style="display:flex; flex-direction:column; gap:0.5rem;">
            ${(m.tasks || []).map((t, tIdx) => `
              <div class="task-item ${t.isCompleted ? 'completed' : ''}">
                <div style="display:flex; align-items:center; gap:0.75rem;">
                  <input type="checkbox" ${t.isCompleted ? 'checked' : ''} onchange="toggleTask(${mIdx}, ${tIdx})" style="width:18px; height:18px; cursor:pointer;">
                  <div>
                    <div style="font-weight:600; font-size:0.92rem; color:var(--text-primary);">${Utils.escapeHTML(t.title)}</div>
                    <div style="font-size:0.78rem; color:var(--text-muted);">${Utils.escapeHTML(t.description || '')}</div>
                  </div>
                </div>
                <div style="display:flex; align-items:center; gap:0.5rem;">
                  <span class="badge badge-cyan" style="font-size:0.7rem;">${Utils.escapeHTML(t.category || 'Task')}</span>
                  <span style="font-size:0.75rem; color:var(--text-muted);">${t.estimatedHours || 10} hrs</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    async function toggleTask(mIdx, tIdx) {
      try {
        const res = await API.put(`/roadmap/tasks/${mIdx}/${tIdx}`, {});
        if (res.success && res.roadmap) {
          renderRoadmap(res.roadmap);
        }
      } catch (err) {
        Utils.showToast(err.message || 'Failed to update task.', 'error');
      }
    }

    async function generateRoadmap() {
      Utils.showLoading('Analyzing skill gaps and architecting monthly milestones...');
      try {
        const res = await API.post('/roadmap/generate', { durationMonths: 6 });
        Utils.hideLoading();
        if (res.success && res.roadmap) {
          Utils.showToast('Personalized roadmap generated successfully!', 'success');
          renderRoadmap(res.roadmap);
        }
      } catch (err) {
        Utils.hideLoading();
        Utils.showToast(err.message || 'Error generating roadmap.', 'error');
      }
    }
  </script>
</body>
</html>
